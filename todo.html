<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Demo · 待辦清單</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 50%, #0ea5e9 100%);
      color: #e2e8f0;
      padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.35rem; }
    .hint { opacity: 0.7; font-size: 0.9rem; margin-bottom: 1.25rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input {
      flex: 1;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(15, 23, 42, 0.6);
      color: #f8fafc;
      border-radius: 8px;
      padding: 0.7rem 0.85rem;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    button {
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 8px;
      padding: 0.65rem 0.8rem;
    }
    li.done span { text-decoration: line-through; opacity: 0.55; }
    li span { flex: 1; }
    .empty { opacity: 0.55; text-align: center; padding: 1rem 0; }
    .remove {
      background: transparent;
      color: #94a3b8;
      padding: 0.25rem 0.4rem;
      font-weight: 500;
    }
    .remove:hover { color: #fda4af; background: transparent; }
    .status { margin-top: 1rem; font-size: 0.85rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>待辦清單測試頁</h1>
    <p class="hint">給測試 PR 用的第二個 demo 頁，資料存在瀏覽器 localStorage。</p>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="輸入一件事，按 Enter 新增" autocomplete="off">
      <button type="submit">新增</button>
    </form>
    <ul id="todo-list"></ul>
    <p class="status" id="todo-status">還沒有待辦事項</p>
  </div>
  <script>
    const STORAGE_KEY = "cursor-demo-todos";
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const status = document.getElementById("todo-status");

    let todos = loadTodos();
    render();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = "";
      persistAndRender();
    });

    list.addEventListener("click", (event) => {
      const target = event.target;
      const item = target.closest("li");
      if (!item) return;
      const id = Number(item.dataset.id);
      if (target.matches("input[type='checkbox']")) {
        todos = todos.map((todo) => todo.id === id ? { ...todo, done: !todo.done } : todo);
        persistAndRender();
      }
      if (target.matches(".remove")) {
        todos = todos.filter((todo) => todo.id !== id);
        persistAndRender();
      }
    });

    function persistAndRender() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      render();
    }

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function render() {
      if (!todos.length) {
        list.innerHTML = '<li class="empty">目前沒有項目，先加一筆看看</li>';
        status.textContent = "還沒有待辦事項";
        return;
      }
      const remaining = todos.filter((todo) => !todo.done).length;
      list.innerHTML = todos.map((todo) => `
        <li class="${todo.done ? "done" : ""}" data-id="${todo.id}">
          <input type="checkbox" ${todo.done ? "checked" : ""} aria-label="標記完成">
          <span>${escapeHtml(todo.text)}</span>
          <button type="button" class="remove" aria-label="刪除">刪除</button>
        </li>
      `).join("");
      status.textContent = `剩下 ${remaining} 件未完成 / 共 ${todos.length} 件`;
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
  </script>
</body>
</html>
